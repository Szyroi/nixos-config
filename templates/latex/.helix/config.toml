[editor]
line-number = "relative"
mouse = true
auto-save = true
bufferline = "multiple"
color-modes = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true
character = "┊"

[editor.lsp]
display-messages = true
display-inlay-hints = true
